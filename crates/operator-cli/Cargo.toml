[package]
name = "operator-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "operator-jack"
path = "src/main.rs"

[dependencies]
operator-core = { path = "../operator-core" }
operator-runtime = { path = "../operator-runtime" }
operator-store = { path = "../operator-store" }
operator-ipc = { path = "../operator-ipc" }
operator-planner = { path = "../operator-planner" }
operator-skills = { path = "../operator-skills" }
operator-exec-browser = { path = "../operator-exec-browser" }
operator-mcp = { path = "../operator-mcp" }
operator-agent = { path = "../operator-agent" }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono.workspace = true
ulid.workspace = true
tokio = { version = "1", features = ["full"] }
# Local settings dashboard (127.0.0.1) — sync, tiny dep tree, matches the sync CLI.
tiny_http = "0.12"
toml = "0.8"
