name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal Binaries & Create Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests
        run: cargo test --locked

      - name: Build universal binaries
        run: make universal

      # Developer ID signing + notarization (M15). Gatekeeper blocks unsigned
      # downloaded binaries; a stable signed helper path also keeps TCC grants
      # durable. Skips cleanly if the signing secrets are not set, so releases
      # still build unsigned until an Apple Developer ID cert is configured.
      # Required secrets: MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
      # MACOS_SIGN_IDENTITY (e.g. "Developer ID Application: Name (TEAMID)"),
      # AC_API_KEY_ID, AC_API_ISSUER_ID, AC_API_KEY_P8 (base64 App Store Connect key).
      - name: Sign & notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "Signing secrets not set — shipping UNSIGNED (Gatekeeper will warn on download)."
            exit 0
          fi
          # Import the Developer ID cert into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Sign the binaries inside each tarball (hardened runtime, timestamped).
          for bin in $(find dist -type f -name 'operator-jack' -o -name 'operator-macos-helper'); do
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          # Notarize each release tarball via notarytool, then staple.
          if [ -n "${AC_API_KEY_P8:-}" ]; then
            echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
            for tarball in dist/operator-jack-*.tar.gz; do
              xcrun notarytool submit "$tarball" \
                --key "$RUNNER_TEMP/ac_key.p8" \
                --key-id "$AC_API_KEY_ID" \
                --issuer "$AC_API_ISSUER_ID" \
                --wait
            done
          else
            echo "App Store Connect API key not set — signed but NOT notarized."
          fi

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/operator-jack-*.tar.gz
            dist/operator-jack-*.tar.gz.sha256

      # Update the Homebrew tap so `brew install rajkum2/tap/operator-jack`
      # tracks the release. Requires a HOMEBREW_TAP_TOKEN secret (a PAT with
      # push access to rajkum2/homebrew-tap); if it is not set, this step
      # skips cleanly rather than failing the release.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."
            exit 0
          fi
          VER="${VERSION#v}"
          TARBALL="dist/operator-jack-${VERSION}-macos-universal.tar.gz"
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          URL="https://github.com/rajkum2/operator-jack/releases/download/${VERSION}/operator-jack-${VERSION}-macos-universal.tar.gz"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rajkum2/homebrew-tap.git" tap
          FORMULA=$(find tap -name 'operator-jack.rb' | head -1)
          if [ -z "$FORMULA" ]; then
            echo "operator-jack.rb not found in tap — skipping." && exit 0
          fi
          sed -i '' -E "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i '' -E "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA"
          sed -i '' -E "s|version \".*\"|version \"${VER}\"|" "$FORMULA"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "operator-jack ${VERSION}"
          git push
