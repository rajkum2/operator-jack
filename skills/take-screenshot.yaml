schema_version: 1
name: take-screenshot
description: Capture the full screen to an image file using macOS screencapture
version: "1.0.0"
author: Operator Jack

parameters:
  - name: output
    type: string
    required: false
    default: "operator-jack-screenshot.png"
    description: >
      Output image path. Relative paths are written under your home directory
      (sys.exec runs with cwd = $HOME). Pass an absolute path to control the location.

steps:
  - id: screenshot
    type: sys.exec
    params:
      command: screencapture
      args: ["-x", "${output}"]
    description: Capture the full screen (no shutter sound) to the output path
